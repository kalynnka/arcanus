name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
        continue-on-error: true # Don't fail if cache save has transient issues

      - name: Set up Python
        run: uv python install 3.11

      - name: Install ruff
        run: uv tool install ruff

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

  unit_tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            name: Unit Tests
          - python-version: "3.12"
            name: Unit Tests (Python 3.12)
          - python-version: "3.13"
            name: Unit Tests (Python 3.13)
          - python-version: "3.14"
            name: Unit Tests (Python 3.14)
          - python-version: "3.15"
            name: Unit Tests (Python 3.15)
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
        continue-on-error: true # Don't fail if cache save has transient issues

      - name: Set up Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Install dependencies
        run: uv sync --dev --all-extras

      - name: Run unit tests with coverage
        run: uv run --no-sync pytest tests/ -v --tb=short --cov=arcanus --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-arcanus
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  benchmarks:
    name: Benchmarks (simulation)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: unit_tests
    env:
      UV_PYTHON: "3.12.15"
      PYTHONHASHSEED: "0"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.15"

      - name: Install dependencies
        run: uv sync --frozen --dev --all-extras

      - name: Run Arcanus benchmarks
        uses: CodSpeedHQ/action@f22792bfac16f3e14eb9fbea76f4a48e9cc22b93 # v4
        with:
          mode: simulation
          runner-version: "4.19.1"
          run: uv run --no-sync pytest benchmark/ -m "not baseline" --codspeed --benchmark-warmup-iterations=5

      - name: Measure reference benchmarks
        run: >-
          uv run --no-sync pytest benchmark/ -m baseline -p no:codspeed
          --benchmark-enable --benchmark-warmup-iterations=5
          --benchmark-json=benchmark-references.json

      - name: Upload reference measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-references
          path: benchmark-references.json
          if-no-files-found: error
          retention-days: 30
